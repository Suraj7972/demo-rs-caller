[project]
name = "propcall-worker"
version = "0.1.0"
description = "arq workers: dialer, callbacks, reminders, post-call, whatsapp."
requires-python = ">=3.11"
dependencies = [
    "propcall-shared",
    "arq>=0.26",
]

[tool.uv.sources]
propcall-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
