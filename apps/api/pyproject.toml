[project]
name = "propcall-api"
version = "0.1.0"
description = "FastAPI REST + webhooks (Plivo, Meta, WhatsApp, lead sources)."
requires-python = ">=3.11"
dependencies = [
    "propcall-shared",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
]

[tool.uv.sources]
propcall-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
